# Anything that isn't a hostname we recognise gets dropped without a response.
# Without this the proxy block below would be the default_server and would
# happily answer to any Host header, including retired names like vinh.todo.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name vinhtruong.localhost localhost 127.0.0.1;

    # Allow large-ish request bodies (task notes, imports)
    client_max_body_size 10m;

    location / {
        proxy_pass http://activity-detector:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / SSE friendly
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
